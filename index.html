<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tool BTK </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --charcoal: #1a1d1f;
    --charcoal-light: #24282b;
    --teal: #00acb4;
    --teal-soft: rgba(0, 172, 180, 0.15);
    --white: #f5f6f7;
    --grey: #8a9296;
  }
 
  * { box-sizing: border-box; }
 
  body {
    margin: 0;
    background: transparent;
    font-family: 'Poppins', sans-serif;
    color: var(--white);
    padding: 24px;
  }
 
  .card {
    max-width: 720px;
    margin: 0 auto;
    background: var(--charcoal);
    border-radius: 16px;
    padding: 28px;
    border: 1px solid rgba(255,255,255,0.06);
    position: relative;
  }
 
  .logo {
    position: absolute;
    top: 20px;
    right: 24px;
    height: 46px;
    width: auto;
  }
 
  .site-link {
    display: block;
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: var(--teal);
    text-decoration: none;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
 
  .site-link:hover {
    text-decoration: underline;
  }
 
  .eyebrow {
    color: var(--teal);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
 
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 18px 0;
    color: var(--white);
  }
 
  .toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
 
  button {
    font-family: 'Poppins', sans-serif;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid rgba(255,255,255,0.12);
    background: var(--charcoal-light);
    color: var(--white);
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
 
  button:hover {
    border-color: var(--teal);
    color: var(--teal);
  }
 
  button.primary {
    background: var(--teal);
    border-color: var(--teal);
    color: var(--charcoal);
    font-weight: 600;
  }
 
  button.primary:hover {
    background: #00979e;
    color: var(--white);
  }
 
  textarea {
    width: 100%;
    min-height: 220px;
    background: var(--charcoal-light);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    color: var(--white);
    font-family: 'Poppins', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    padding: 16px;
    resize: vertical;
    outline: none;
  }
 
  textarea:focus {
    border-color: var(--teal);
    box-shadow: 0 0 0 3px var(--teal-soft);
  }
 
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
    flex-wrap: wrap;
    gap: 10px;
  }
 
  .count {
    font-size: 12px;
    color: var(--grey);
  }
 
  .count strong {
    color: var(--white);
  }
 
  .hint {
    font-size: 12px;
    color: var(--grey);
    margin-top: 10px;
    line-height: 1.5;
  }
 
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--teal);
    color: var(--charcoal);
    font-weight: 600;
    font-size: 13px;
    padding: 10px 18px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.2s ease;
  }
 
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
<h3> LinkedIn Formatter </h3>  
  <a href="https://baztechknow.github.io/tools/linkedin-text-formatter_2.html"> Use LinkedIn Text Formatter </a>
</body>
</html>
